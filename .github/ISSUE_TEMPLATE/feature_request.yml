name: Feature request
description: Suggest an idea for NovaCrates
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: optional
    attributes:
      label: Options
      options:
        - label: This should be configurable (config.yml flag)
        - label: I can help implement this
